<!-- Блок T123 на Tilda.
     1. Замените YOUR_YANDEX_MAPS_API_KEY на ключ JavaScript API Яндекс Карт.
     2. Замените адрес Render в двух местах ниже.
     3. Укажите домен опубликованной Tilda-страницы в TILDA_ORIGINS на Render.
     Подключайте API один раз на странице. -->
<div id="av-map" style="height:360px;border-radius:14px;overflow:hidden" aria-label="Выберите участок на карте"></div>
<p id="av-location" role="status">Нажмите на карту, чтобы выбрать участок.</p>
<iframe id="av-calculator" src="https://YOUR-SERVICE.onrender.com/calculator?embed=1"
  title="Расчёт агривольтаики" style="width:100%;height:1700px;border:0" loading="lazy"></iframe>
<script src="https://api-maps.yandex.ru/2.1/?apikey=YOUR_YANDEX_MAPS_API_KEY&amp;lang=ru_RU&amp;coordorder=latlong"></script>
<script>
(function () {
  const serviceOrigin = 'https://YOUR-SERVICE.onrender.com';
  const frame = document.getElementById('av-calculator');
  const label = document.getElementById('av-location');
  let marker, selected;
  function sendLocation() {
    if (selected) frame.contentWindow.postMessage({type: 'agrivoltaic:location', ...selected}, serviceOrigin);
  }
  window.addEventListener('message', function(event) {
    if (event.origin !== serviceOrigin || event.source !== frame.contentWindow) return;
    if (event.data && event.data.type === 'agrivoltaic:ready') sendLocation();
  });
  if (!window.ymaps) {
    label.textContent = 'Не удалось загрузить карту. Попробуйте обновить страницу.';
    return;
  }
  ymaps.ready(function () {
    const map = new ymaps.Map('av-map', {
      center: [45, 38], zoom: 5, controls: ['zoomControl', 'typeSelector']
    });
    map.events.add('click', function(event) {
      const coords = event.get('coords'); // API 2.1: широта, долгота.
      if (!Array.isArray(coords) || !Number.isFinite(coords[0]) || !Number.isFinite(coords[1]) || Math.abs(coords[0]) > 90) return;
      selected = {lat: coords[0], lon: ((coords[1] + 180) % 360 + 360) % 360 - 180};
      const position = [selected.lat, selected.lon];
      if (!marker) {
        marker = new ymaps.Placemark(position, {hintContent: 'Выбранный участок'}, {preset: 'islands#greenDotIcon'});
        map.geoObjects.add(marker);
      } else marker.geometry.setCoordinates(position);
      label.textContent = 'Участок: ' + selected.lat.toFixed(5) + ', ' + selected.lon.toFixed(5);
      sendLocation();
    });
  });
})();
</script>
